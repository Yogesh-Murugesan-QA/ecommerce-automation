name: UI Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Chrome is preinstalled on ubuntu-latest; Selenium Manager downloads the matching driver
      - name: Run tests (headless Chrome)
        run: mvn -B clean test -Dheadless=true

      - name: Upload Extent report, logs and screenshots
        if: always()   # upload even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/reports/
            target/logs/
            target/screenshots/
          if-no-files-found: warn
